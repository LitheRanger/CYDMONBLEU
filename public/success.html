<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - MON|BLEU</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --ink: #1b1b1b;
            --ink-soft: #4b4b4b;
            --cream: #fff7ee;
            --paper: #fffaf4;
            --accent: #ff6b3d;
            --accent-2: #1e8f85;
            --success: #168f55;
            --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 18px 42px rgba(15, 23, 42, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 15% 10%, rgba(255, 107, 61, 0.08), transparent 45%),
                radial-gradient(circle at 80% 15%, rgba(30, 143, 133, 0.08), transparent 40%),
                linear-gradient(135deg, #fff3e6 0%, #f7efe7 60%, #f2ede6 100%);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
        }

        .container {
            width: min(640px, 100%);
            background: var(--paper);
            border-radius: 18px;
            box-shadow: var(--shadow-md);
            padding: 40px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: riseIn 0.5s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: -40% -20% auto -20%;
            height: 140px;
            background: linear-gradient(120deg, rgba(255, 107, 61, 0.18), rgba(30, 143, 133, 0.15));
            transform: rotate(-2deg);
        }

        .container > * {
            position: relative;
            z-index: 1;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(22, 143, 85, 0.12);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(26px, 4vw, 34px);
            margin-bottom: 10px;
        }

        p {
            color: var(--ink-soft);
            margin-bottom: 16px;
            font-size: 16px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(27, 27, 27, 0.12);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 520px) {
            .container {
                padding: 32px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <span class="status-pill">Procesando pago</span>
        <h1>Verificando tu transaccion</h1>
        <div class="loading-row">
            <div class="loading"></div>
            <p>Esto puede tomar unos segundos.</p>
        </div>
    </div>

    <script src="js/success.js" defer></script>
</body>
</html>
