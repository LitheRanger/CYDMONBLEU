<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - MON|BLEU</title>
    <style>
        :root {
            --primary: #000;
            --secondary: #fff;
            --text-primary: #000;
            --text-secondary: #666;
            --bg-light: #f9f9f9;
            --success-color: #388e3c;
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        @font-face {
            font-family: 'HelveticaNeueLTProHv';
            src: url('HelveticaNeueLTProHv.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-light) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--secondary);
            padding: 48px 32px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="loading"></div>
        <p>Verificando pago...</p>
    </div>

    <script src="js/success.js" defer></script>
</body>
</html>
