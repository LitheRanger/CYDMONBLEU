<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - MON|BLEU</title>
    <style>
        :root {
            --primary: #000;
            --secondary: #fff;
            --text-primary: #000;
            --text-secondary: #666;
            --border-light: #e0e0e0;
            --bg-light: #f9f9f9;
            --bg-lighter: #fafafa;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --success-color: #388e3c;
        }

        @font-face {
            font-family: 'HelveticaNeueLTProHv';
            src: url('HelveticaNeueLTProHv.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
        }

        .container {
            width: min(640px, 100%);
            background: var(--secondary);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            padding: 40px 32px;
            text-align: center;
            border: 1px solid var(--border-light);
            animation: riseIn 0.5s ease;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 142, 60, 0.12);
            color: var(--success-color);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-size: clamp(24px, 4vw, 32px);
            margin-bottom: 10px;
        }

        h3 {
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-size: 18px;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 16px;
        }

        button:hover, a:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        button:active, a:active {
            transform: translateY(0);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            background: rgba(56, 142, 60, 0.12);
            color: var(--success-color);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            border: 1px solid var(--primary);
            background: var(--primary);
            color: var(--secondary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .tracking {
            margin: 20px 0 12px;
            background: var(--bg-light);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 18px;
        }

        .tracking-label {
            font-size: 12px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .tracking-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .tracking-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tracking-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--primary);
            background: var(--secondary);
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .label-section {
            margin: 18px 0 6px;
        }

        .label-note {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .summary {
            background: var(--bg-lighter);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 18px;
            text-align: left;
            margin: 18px 0;
        }

        .summary h3 {
            margin-bottom: 12px;
        }

        .summary-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 520px) {
            .container {
                padding: 32px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <span class="status-pill">Procesando pago</span>
        <h1>Verificando tu transaccion</h1>
        <div class="loading-row">
            <div class="loading"></div>
            <p>Esto puede tomar unos segundos.</p>
        </div>
    </div>

    <script src="js/success.js" defer></script>
</body>
</html>
