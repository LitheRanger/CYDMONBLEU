<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - MON|BLEU</title>
    <style>
        :root {
            --primary: #000;
            --secondary: #fff;
            --text-primary: #000;
            --text-secondary: #666;
            --bg-light: #f9f9f9;
            --success-color: #388e3c;
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #fff;
                --secondary: #1a1a1a;
                --text-primary: #f5f5f5;
                --text-secondary: #b0b0b0;
                --bg-light: #2a2a2a;
                --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-light) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--secondary);
            padding: 48px 32px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 24px;
            animation: bounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--success-color);
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 16px;
        }

        .tracking {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 12px;
            margin: 24px 0;
            border: 2px dashed var(--success-color);
        }

        .tracking-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .tracking-number {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: var(--primary);
        }

        .summary {
            text-align: left;
            margin: 24px 0;
            padding: 20px;
            background: var(--bg-light);
            border-radius: 12px;
        }

        .summary h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .summary-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--secondary);
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="loading"></div>
        <p>Verificando pago...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        const API_BASE = (function() {
            const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            return isDev ? 'http://localhost:3000' : window.location.origin;
        })();

        async function verifyPayment() {
            const container = document.getElementById('content');
            
            if (!sessionId) {
                container.innerHTML = `
                    <div class="success-icon">❌</div>
                    <h1>Error</h1>
                    <p>No se encontró información del pago.</p>
                    <a href="/" class="btn">Volver al inicio</a>
                `;
                return;
            }

            try {
                const verifyRes = await fetch(`${API_BASE}/api/verify-payment/${encodeURIComponent(sessionId)}`);
                const verifyData = await verifyRes.json();

                if (!verifyData.success) {
                    throw new Error('No se pudo verificar el pago');
                }

                const paymentStatus = verifyData.paymentStatus;
                const isPaid = paymentStatus === 'paid' || paymentStatus === 'no_payment_required';

                if (!isPaid) {
                    container.innerHTML = `
                        <div class="success-icon">⏳</div>
                        <h1>Pago en proceso</h1>
                        <p>Tu pago aún no se confirma. Intenta de nuevo en unos minutos.</p>
                        <a href="/success.html?session_id=${encodeURIComponent(sessionId)}" class="btn">Reintentar verificación</a>
                    `;
                    return;
                }

                const trackingNumber = localStorage.getItem('mon_tracking') || 'MON-XXXXXX-XXXXXX';
                const orderData = JSON.parse(localStorage.getItem('mon_order_data') || '{}');

                let summaryHtml = '';
                if (orderData.items && orderData.items.length > 0) {
                    summaryHtml = `
                        <div class="summary">
                            <h3>Resumen de tu solicitud</h3>
                            ${orderData.items.map(item => `
                                <div class="summary-item">
                                    <div style="font-weight:600;">${item.name}</div>
                                    <div style="font-size:12px;color:var(--text-secondary);">
                                        Razón: ${item.reason}
                                        ${item.replacementTitle ? `<br>Nueva talla: ${item.replacementTitle}` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="success-icon">✅</div>
                    <h1>¡Pago Confirmado!</h1>
                    <p>Tu solicitud de ${orderData.tipo || 'devolución'} ha sido procesada exitosamente.</p>
                    
                    <div class="tracking">
                        <div class="tracking-label">Tu número de seguimiento:</div>
                        <div class="tracking-number">${trackingNumber}</div>
                    </div>

                    ${summaryHtml}

                    <p>Recibirás un correo con los detalles y las instrucciones para enviar tu producto.</p>
                    <p style="font-size:14px;">Guarda tu número de seguimiento para consultar el estado de tu solicitud.</p>
                    
                    <a href="/" class="btn">Volver al inicio</a>
                `;

                // Limpiar localStorage
                localStorage.removeItem('mon_tracking');
                localStorage.removeItem('mon_request_id');
                localStorage.removeItem('mon_order_data');

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `
                    <div class="success-icon">✅</div>
                    <h1>¡Pago Confirmado!</h1>
                    <p>Tu solicitud ha sido procesada exitosamente.</p>
                    <p>Recibirás un correo con los detalles.</p>
                    <a href="/" class="btn">Volver al inicio</a>
                `;
            }
        }

        verifyPayment();
    </script>
</body>
</html>
