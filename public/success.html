<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - MON|BLEU</title>
    <style>
        :root {
            --primary: #000;
            --secondary: #fff;
            --text-primary: #000;
            --text-secondary: #666;
            --bg-light: #f9f9f9;
            --success-color: #388e3c;
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        @font-face {
            font-family: 'HelveticaNeueLTProHv';
            src: url('HelveticaNeueLTProHv.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-light) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--secondary);
            padding: 48px 32px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 24px;
            animation: bounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--success-color);
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 800;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 16px;
        }

        .tracking {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 12px;
            margin: 24px 0;
            border: 2px dashed var(--success-color);
        }

        .tracking-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .tracking-number {
            font-size: 24px;
            font-weight: 800;
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            color: var(--primary);
        }

        .tracking-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .tracking-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-light, #e0e0e0);
            background: var(--secondary);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .summary {
            text-align: left;
            margin: 24px 0;
            padding: 20px;
            background: var(--bg-light);
            border-radius: 12px;
        }

        .summary h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .summary-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--secondary);
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
            transition: transform 0.2s;
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 800;
        }

        .btn.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .label-section {
            margin-top: 16px;
        }

        .label-note {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="loading"></div>
        <p>Verificando pago...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const requestIdParam = urlParams.get('request_id');

        const API_BASE = (function() {
            const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            return isDev ? 'http://localhost:3000' : window.location.origin;
        })();

        async function verifyPayment() {
            const container = document.getElementById('content');
            
            if (!sessionId && requestIdParam) {
                renderSuccess(requestIdParam, true);
                return;
            }

            if (!sessionId) {
                container.innerHTML = `
                    <div class="success-icon">❌</div>
                    <h1>Error</h1>
                    <p>No se encontró información del pago.</p>
                    <a href="/" class="btn">Volver al inicio</a>
                `;
                return;
            }

            try {
                const verifyRes = await fetch(`${API_BASE}/api/verify-payment/${encodeURIComponent(sessionId)}`);
                const verifyData = await verifyRes.json();

                if (!verifyData.success) {
                    throw new Error('No se pudo verificar el pago');
                }

                const paymentStatus = verifyData.paymentStatus;
                const isPaid = paymentStatus === 'paid' || paymentStatus === 'no_payment_required';

                if (!isPaid) {
                    container.innerHTML = `
                        <div class="success-icon">⏳</div>
                        <h1>Pago en proceso</h1>
                        <p>Tu pago aún no se confirma. Intenta de nuevo en unos minutos.</p>
                        <a href="/success.html?session_id=${encodeURIComponent(sessionId)}" class="btn">Reintentar verificación</a>
                    `;
                    return;
                }

                const trackingNumber = '—';
                const orderData = JSON.parse(localStorage.getItem('mon_order_data') || '{}');

                let summaryHtml = '';
                if (orderData.items && orderData.items.length > 0) {
                    summaryHtml = `
                        <div class="summary">
                            <h3>Resumen de tu solicitud</h3>
                            ${orderData.items.map(item => `
                                <div class="summary-item">
                                    <div style="font-weight:600;">${item.name}</div>
                                    <div style="font-size:12px;color:var(--text-secondary);">
                                        Razón: ${item.reason}
                                        ${item.replacementColor || item.replacementSize ? `<br>Nueva prenda: ${[item.replacementColor ? `Color: ${item.replacementColor}` : '', item.replacementSize ? `Talla: ${item.replacementSize}` : ''].filter(Boolean).join(' • ')}` : (item.replacementTitle ? `<br>Nueva prenda: ${item.replacementTitle}` : '')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="success-icon">✅</div>
                    <h1>¡Pago Confirmado!</h1>
                    <p>Tu solicitud de ${orderData.tipo || 'devolución'} ha sido procesada exitosamente.</p>
                    
                    <div class="tracking">
                        <div class="tracking-label">Tu número de seguimiento:</div>
                        <div class="tracking-number" id="tracking-number">${trackingNumber}</div>
                        <div class="tracking-actions">
                            <button class="tracking-btn" id="btn-copy-tracking" type="button">Copiar</button>
                            <a class="tracking-btn" id="btn-track-link" href="#" target="_blank" rel="noopener">Rastrear</a>
                        </div>
                    </div>

                    ${summaryHtml}

                    <p>Recibirás un correo con los detalles y las instrucciones para enviar tu producto.</p>
                    <p style="font-size:14px;">Guarda tu número de seguimiento para consultar el estado de tu solicitud.</p>

                    <div class="label-section">
                        <a id="btn-download-label" class="btn disabled" href="#">Descargar guía</a>
                        <div id="label-note" class="label-note">Preparando tu guía...</div>
                    </div>
                    
                    <a href="/" class="btn">Volver al inicio</a>
                `;

                const copyBtn = document.getElementById('btn-copy-tracking');
                const trackLink = document.getElementById('btn-track-link');
                if (copyBtn) {
                    copyBtn.setAttribute('disabled', 'disabled');
                    copyBtn.style.opacity = '0.6';
                    copyBtn.style.pointerEvents = 'none';
                }
                if (trackLink) {
                    trackLink.setAttribute('aria-disabled', 'true');
                    trackLink.style.opacity = '0.6';
                    trackLink.style.pointerEvents = 'none';
                }

                const requestId = localStorage.getItem('mon_request_id');
                await initLabelDownload(requestId);

                // Limpiar localStorage
                localStorage.removeItem('mon_tracking');
                localStorage.removeItem('mon_request_id');
                localStorage.removeItem('mon_order_data');

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `
                    <div class="success-icon">✅</div>
                    <h1>¡Pago Confirmado!</h1>
                    <p>Tu solicitud ha sido procesada exitosamente.</p>
                    <p>Recibirás un correo con los detalles.</p>
                    <a href="/" class="btn">Volver al inicio</a>
                `;
            }
        }

        async function renderSuccess(requestId, noPayment) {
            const container = document.getElementById('content');
            const orderData = JSON.parse(localStorage.getItem('mon_order_data') || '{}');
            const trackingNumber = '—';

            let summaryHtml = '';
            if (orderData.items && Array.isArray(orderData.items)) {
                summaryHtml = `
                    <div class="summary">
                        <h3>Resumen</h3>
                        ${orderData.items.map(item => `
                            <div class="summary-item">
                                <div style="font-weight:600;">${item.name}</div>
                                <div style="font-size:12px;color:var(--text-secondary);">
                                    Razón: ${item.reason}
                                    ${item.replacementColor || item.replacementSize ? `<br>Nueva prenda: ${[item.replacementColor ? `Color: ${item.replacementColor}` : '', item.replacementSize ? `Talla: ${item.replacementSize}` : ''].filter(Boolean).join(' • ')}` : (item.replacementTitle ? `<br>Nueva prenda: ${item.replacementTitle}` : '')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="success-icon">✅</div>
                <h1>¡Solicitud Recibida!</h1>
                <p>${noPayment ? 'Tu solicitud fue aprobada por defecto y no requiere pago.' : 'Tu solicitud ha sido procesada.'}</p>
                
                <div class="tracking">
                    <div class="tracking-label">Tu número de seguimiento:</div>
                    <div class="tracking-number" id="tracking-number">${trackingNumber}</div>
                    <div class="tracking-actions">
                        <button class="tracking-btn" id="btn-copy-tracking" type="button">Copiar</button>
                        <a class="tracking-btn" id="btn-track-link" href="#" target="_blank" rel="noopener">Rastrear</a>
                    </div>
                </div>

                ${summaryHtml}

                <p>Recibirás un correo con los detalles y las instrucciones para enviar tu producto.</p>

                <div class="label-section">
                    <a id="btn-download-label" class="btn disabled" href="#">Descargar guía</a>
                    <div id="label-note" class="label-note">Preparando tu guía...</div>
                </div>
                
                <a href="/" class="btn">Volver al inicio</a>
            `;

            await initLabelDownload(requestId);
        }

        function base64ToBlob(base64, mime) {
            const byteChars = atob(base64);
            const byteNumbers = new Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) {
                byteNumbers[i] = byteChars.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            return new Blob([byteArray], { type: mime });
        }

        function getExtension(mime) {
            if (!mime) return 'pdf';
            const lower = mime.toLowerCase();
            if (lower.includes('pdf')) return 'pdf';
            if (lower.includes('png')) return 'png';
            if (lower.includes('jpeg') || lower.includes('jpg')) return 'jpg';
            return 'pdf';
        }

        async function initLabelDownload(requestId) {
            const btn = document.getElementById('btn-download-label');
            const note = document.getElementById('label-note');
            const trackingEl = document.getElementById('tracking-number');
            const copyBtn = document.getElementById('btn-copy-tracking');
            const trackLink = document.getElementById('btn-track-link');

            if (!btn || !note) return;

            if (!requestId) {
                note.textContent = 'Guía no disponible en este momento.';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/label/${encodeURIComponent(requestId)}`);
                const data = await res.json();

                if (!data.success) {
                    note.textContent = 'Tu guía aún no está lista. Intenta más tarde.';
                    return;
                }

                if (data.trackingNumber && trackingEl) {
                    trackingEl.textContent = data.trackingNumber;
                }

                if (data.trackingNumber && trackLink) {
                    trackLink.href = 'https://track.myeship.co/en/track/eship-es';
                    trackLink.setAttribute('aria-disabled', 'false');
                    trackLink.style.opacity = '1';
                    trackLink.style.pointerEvents = 'auto';
                }

                if (data.trackingNumber && copyBtn) {
                    copyBtn.removeAttribute('disabled');
                    copyBtn.style.opacity = '1';
                    copyBtn.style.pointerEvents = 'auto';
                    copyBtn.addEventListener('click', async () => {
                        try {
                            await navigator.clipboard.writeText(data.trackingNumber);
                            copyBtn.textContent = 'Copiado';
                            setTimeout(() => (copyBtn.textContent = 'Copiar'), 1200);
                        } catch (e) {
                            const temp = document.createElement('textarea');
                            temp.value = data.trackingNumber;
                            document.body.appendChild(temp);
                            temp.select();
                            document.execCommand('copy');
                            document.body.removeChild(temp);
                            copyBtn.textContent = 'Copiado';
                            setTimeout(() => (copyBtn.textContent = 'Copiar'), 1200);
                        }
                    }, { once: true });
                }

                if (!data.labelBase64) {
                    note.textContent = 'Tu guía aún no está lista. Intenta más tarde.';
                    return;
                }

                const mime = data.labelMime || 'application/pdf';
                const blob = base64ToBlob(data.labelBase64, mime);
                const url = URL.createObjectURL(blob);
                const ext = getExtension(mime);
                const filename = `guia-${data.trackingNumber || 'myeship'}.${ext}`;

                btn.classList.remove('disabled');
                btn.href = url;
                btn.download = filename;
                note.textContent = data.trackingNumber
                    ? `Tracking MyeShip: ${data.trackingNumber}`
                    : 'Guía lista para descargar.';
            } catch (err) {
                console.error('Error descargando guía:', err);
                note.textContent = 'No se pudo obtener la guía. Intenta más tarde.';
            }
        }

        verifyPayment();
    </script>
</body>
</html>
