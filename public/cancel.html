<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Cancelado - MON|BLEU</title>
    <style>
        :root {
            --primary: #000;
            --secondary: #fff;
            --text-primary: #000;
            --text-secondary: #666;
            --border-light: #e0e0e0;
            --bg-light: #f9f9f9;
            --bg-lighter: #fafafa;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --warning-color: #f57c00;
        }

        @font-face {
            font-family: 'HelveticaNeueLTProHv';
            src: url('HelveticaNeueLTProHv.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
        }

        .card {
            width: min(640px, 100%);
            background: var(--secondary);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            padding: 40px 32px;
            text-align: center;
            border: 1px solid var(--border-light);
            animation: riseIn 0.5s ease;
        }

        .icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(245, 124, 0, 0.12);
            color: var(--warning-color);
            display: grid;
            place-items: center;
            font-size: 26px;
            margin: 0 auto 16px;
        }

        h1 {
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-size: clamp(24px, 4vw, 32px);
            margin-bottom: 10px;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 16px;
        }

        .info-box {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 16px;
            margin: 22px 0;
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: var(--secondary);
            padding: 12px 26px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            border: 0;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 520px) {
            .card {
                padding: 32px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>Pago cancelado</h1>
        <p>Se detuvo el proceso de pago y tu solicitud quedo en espera.</p>

        <div class="info-box">
            Puedes retomar el pago en cualquier momento para finalizar tu devolucion.
        </div>

        <p>Quieres intentar nuevamente?</p>
        <div class="actions">
            <button id="btn-retry" class="btn" type="button">Reintentar pago</button>
            <a href="/" class="btn secondary">Volver al inicio</a>
        </div>
    </div>

    <script src="js/cancel.js" defer></script>
</body>
</html>
