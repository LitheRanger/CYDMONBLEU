<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Cancelado - MON|BLEU</title>
    <style>
        :root {
            --primary: #000;
            --secondary: #fff;
            --text-primary: #000;
            --text-secondary: #666;
            --bg-light: #f9f9f9;
            --warning-color: #f57c00;
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        @font-face {
            font-family: 'HelveticaNeueLTProHv';
            src: url('HelveticaNeueLTProHv.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-light) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--secondary);
            padding: 48px 32px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--warning-color);
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 800;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--secondary);
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
            transition: transform 0.2s;
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 800;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            margin-left: 8px;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .info-box {
            background: var(--bg-light);
            padding: 16px;
            border-radius: 12px;
            margin: 24px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Pago Cancelado</h1>
        <p>Has cancelado el proceso de pago.</p>
        
        <div class="info-box">
            <p style="margin:0;">Tu solicitud de devolución se guardó pero no está completa sin el pago de la guía.</p>
        </div>

        <p>¿Quieres intentar nuevamente?</p>
        <div class="actions">
            <button id="btn-retry" class="btn" type="button">Reintentar pago</button>
            <a href="/" class="btn secondary">Volver al inicio</a>
        </div>
    </div>

    <script>
        const API_BASE = (function() {
            const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            return isDev ? 'http://localhost:3000' : window.location.origin;
        })();

        const retryBtn = document.getElementById('btn-retry');
        const requestId = localStorage.getItem('mon_request_id');
        const orderDataRaw = localStorage.getItem('mon_order_data');
        const contactEmail = localStorage.getItem('mon_contact_email');

        if (!requestId || !orderDataRaw || !retryBtn) {
            if (retryBtn) retryBtn.style.display = 'none';
        } else {
            retryBtn.addEventListener('click', async () => {
                retryBtn.disabled = true;
                retryBtn.textContent = 'Reintentando...';

                const orderData = JSON.parse(orderDataRaw || '{}');
                const orderId = orderData.orderId || '';
                const email = contactEmail || '';

                if (!orderId) {
                    retryBtn.disabled = false;
                    retryBtn.textContent = 'Reintentar pago';
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/api/create-mp-preference`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        mode: 'cors',
                        body: JSON.stringify({
                            requestId,
                            amount: 150,
                            currency: 'mxn',
                            description: `Guía de devolución - Orden ${orderId}`,
                            orderId,
                            contactEmail: email
                        })
                    });
                    const data = await res.json();
                    if (data.success && data.checkoutUrl) {
                        window.location.href = data.checkoutUrl;
                    } else {
                        retryBtn.disabled = false;
                        retryBtn.textContent = 'Reintentar pago';
                    }
                } catch (e) {
                    retryBtn.disabled = false;
                    retryBtn.textContent = 'Reintentar pago';
                }
            });
        }
    </script>
</body>
</html>
