<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Cancelado - MON|BLEU</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --ink: #1b1b1b;
            --ink-soft: #4b4b4b;
            --cream: #fff7ee;
            --paper: #fffaf4;
            --accent: #ff6b3d;
            --accent-2: #1e8f85;
            --warning: #f08c2b;
            --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 18px 42px rgba(15, 23, 42, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 15% 10%, rgba(255, 107, 61, 0.08), transparent 45%),
                radial-gradient(circle at 80% 15%, rgba(30, 143, 133, 0.08), transparent 40%),
                linear-gradient(135deg, #fff3e6 0%, #f7efe7 60%, #f2ede6 100%);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
        }

        .card {
            width: min(640px, 100%);
            background: var(--paper);
            border-radius: 18px;
            box-shadow: var(--shadow-md);
            padding: 40px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: riseIn 0.5s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -40% -20% auto -20%;
            height: 140px;
            background: linear-gradient(120deg, rgba(255, 107, 61, 0.18), rgba(30, 143, 133, 0.15));
            transform: rotate(-2deg);
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(240, 140, 43, 0.16);
            color: var(--warning);
            display: grid;
            place-items: center;
            font-size: 28px;
            margin: 0 auto 16px;
            box-shadow: var(--shadow-sm);
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(26px, 4vw, 34px);
            margin-bottom: 10px;
        }

        p {
            color: var(--ink-soft);
            margin-bottom: 16px;
            font-size: 16px;
        }

        .info-box {
            background: var(--cream);
            border-radius: 12px;
            padding: 16px;
            margin: 22px 0;
            font-size: 14px;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            color: #fff;
            padding: 12px 26px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            border: 0;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: transparent;
            color: var(--ink);
            border: 2px solid var(--ink);
            box-shadow: none;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 520px) {
            .card {
                padding: 32px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>Pago cancelado</h1>
        <p>Se detuvo el proceso de pago y tu solicitud quedo en espera.</p>

        <div class="info-box">
            Puedes retomar el pago en cualquier momento para finalizar tu devolucion.
        </div>

        <p>Quieres intentar nuevamente?</p>
        <div class="actions">
            <button id="btn-retry" class="btn" type="button">Reintentar pago</button>
            <a href="/" class="btn secondary">Volver al inicio</a>
        </div>
    </div>

    <script src="js/cancel.js" defer></script>
</body>
</html>
