<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Cancelado - MON|BLEU</title>
    <style>
        :root {
            --primary: #000;
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--warning-color);
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 800;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--secondary);
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
            transition: transform 0.2s;
            font-family: 'HelveticaNeueLTProHv', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 800;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            margin-left: 8px;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .info-box {
            background: var(--bg-light);
            padding: 16px;
            border-radius: 12px;
            margin: 24px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Pago Cancelado</h1>
        <p>Has cancelado el proceso de pago.</p>
        
        <div class="info-box">
            <p style="margin:0;">Tu solicitud de devolución se guardó pero no está completa sin el pago de la guía.</p>
        </div>

        <p>¿Quieres intentar nuevamente?</p>
        <div class="actions">
            <button id="btn-retry" class="btn" type="button">Reintentar pago</button>
            <a href="/" class="btn secondary">Volver al inicio</a>
        </div>
    </div>

    <script src="js/cancel.js" defer></script>
</body>
</html>
