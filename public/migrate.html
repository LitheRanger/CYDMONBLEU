<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migración - MON|BLEU Admin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #000;
            margin-bottom: 24px;
            font-size: 24px;
        }
        .info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn {
            background: #000;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            display: block;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }
        .status.loading {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
            display: block;
        }
        .spinner {
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Migración de Items</h1>
        
        <div class="info">
            <strong>¿Qué hace esto?</strong><br>
            Enriquece todos los items existentes en la base de datos consultando Shopify para obtener:
            <ul style="margin: 8px 0; padding-left: 20px;">
                <li>Nombres de productos</li>
                <li>Títulos de variantes (talla/color)</li>
                <li>Cantidades y precios</li>
                <li>Títulos de reemplazos</li>
            </ul>
            Esto puede tardar varios minutos si hay muchos pedidos.
        </div>

        <button class="btn" id="startBtn" onclick="startMigration()">Iniciar Migración</button>

        <div id="status" class="status"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function startMigration() {
            const btn = document.getElementById('startBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.className = 'status loading';
            status.innerHTML = '<span class="spinner">⏳</span>Migrando... Por favor espera...';

            try {
                // Solicitar autenticación
                const username = prompt('Usuario admin:');
                if (!username) {
                    throw new Error('Autenticación cancelada');
                }
                const password = prompt('Contraseña admin:');
                if (!password) {
                    throw new Error('Autenticación cancelada');
                }

                const auth = btoa(`${username}:${password}`);

                const res = await fetch(`${API_BASE}/api/admin/migrate-enrich-items`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Basic ${auth}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Error en la migración');
                }

                status.className = 'status success';
                status.innerHTML = `
                    ✅ <strong>Migración completada</strong><br>
                    Actualizadas: <strong>${data.updated}/${data.total}</strong> solicitudes<br>
                    <small>${data.message}</small>
                `;
            } catch (err) {
                status.className = 'status error';
                status.innerHTML = `❌ <strong>Error:</strong> ${err.message}`;
                btn.disabled = false;
            }
        }

        // Info inicial
        console.log('📝 Página de migración cargada');
    </script>
</body>
</html>
